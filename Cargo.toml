[package]
name = "popple-ws"
version = "0.1.0"
edition = "2024"

[dependencies]
slopio = "0.1"
slopio-tls = "0.1"
rustls = "0.23"
aws-lc-rs = "1"

[dev-dependencies]
rcgen = { version = "0.13", features = ["aws_lc_rs"] }
webpki-roots = "1"

[lints.rust]
# Set by `cargo fuzz`: exposes the parser entry points `fuzz/` drives.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
